<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="512x512" href="/musicsync-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/musicsync-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#06060a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="MusicSync" />
    <title>MusicSync | Multi-Device Synchronized Music System</title>
    <meta name="description" content="Turn any group of phones, laptops, and speakers into a perfectly synchronized sound system with zero-delay real-time audio playback." />
    <!-- Modern typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  </head>
  <body class="bg-dark-950 text-slate-100 antialiased selection:bg-electric-cyan selection:text-black overflow-x-hidden min-h-screen">
    <div id="root">
      <div style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background-color: #06060a; padding: 1.5rem; position: relative; overflow: hidden;">
        <!-- Ambient neon glow behind logo -->
        <div style="position: absolute; width: 400px; height: 400px; background: radial-gradient(circle, rgba(0,240,255,0.22) 0%, rgba(192,132,252,0.14) 45%, transparent 70%); filter: blur(50px); pointer-events: none; border-radius: 9999px;"></div>
        
        <div style="position: relative; display: flex; flex-direction: column; align-items: center; gap: 1.5rem; max-width: 460px; width: 90vw;">
          <img src="/musicsync-logo.png" alt="MusicSync" style="width: 100%; max-width: 460px; height: auto; object-fit: contain; filter: drop-shadow(0 0 35px rgba(0,240,255,0.4));" />
          
          <div style="display: flex; align-items: center; gap: 10px; padding: 8px 20px; border-radius: 9999px; background: rgba(14, 16, 26, 0.95); border: 1px solid rgba(0, 240, 255, 0.35); box-shadow: 0 0 20px rgba(0, 240, 255, 0.25);">
            <div style="width: 14px; height: 14px; border: 2px solid rgba(0,240,255,0.2); border-top-color: #00f0ff; border-radius: 50%; animation: spin 1s linear infinite;"></div>
            <span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 700; color: #00f0ff; letter-spacing: 0.12em; text-transform: uppercase;">Initializing Mesh</span>
          </div>
        </div>
      </div>
    </div>
    <style>
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
    </style>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
