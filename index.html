<!doctype html>
<html lang="en" class="dark" style="margin: 0; padding: 0; background-color: #06060a; width: 100%; height: 100%; overflow-x: hidden;">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="512x512" href="/musicsync-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/musicsync-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#06060a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="MusicSync" />
    <title>MusicSync | Multi-Device Synchronized Music System</title>
    <meta name="description" content="Turn any group of phones, laptops, and speakers into a perfectly synchronized sound system with zero-delay real-time audio playback." />
    <!-- Critical reset styles to prevent any initial browser white margins/borders -->
    <style>
      *, *::before, *::after {
        box-sizing: border-box;
      }
      html, body {
        margin: 0 !important;
        padding: 0 !important;
        background-color: #06060a !important;
        color: #f1f5f9;
        width: 100%;
        height: 100%;
        min-height: 100vh;
        overflow-x: hidden;
        border: none !important;
      }
      #root {
        margin: 0;
        padding: 0;
        width: 100%;
        min-height: 100vh;
        background-color: #06060a;
      }
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.55; transform: scale(1); }
        50% { opacity: 0.85; transform: scale(1.05); }
      }
    </style>
    <!-- Modern typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  </head>
  <body style="margin: 0 !important; padding: 0 !important; background-color: #06060a !important;" class="bg-dark-950 text-slate-100 antialiased selection:bg-electric-cyan selection:text-black overflow-x-hidden min-h-screen">
    <div id="root">
      <div style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background-color: #06060a; padding: 1.5rem; position: relative; overflow: hidden;">
        <!-- Ambient neon glow behind logo -->
        <div style="position: absolute; width: 420px; height: 420px; background: radial-gradient(circle, rgba(0,240,255,0.18) 0%, rgba(192,132,252,0.12) 45%, transparent 70%); filter: blur(60px); pointer-events: none; border-radius: 9999px; animation: pulseGlow 3s ease-in-out infinite;"></div>
        
        <div style="position: relative; display: flex; flex-direction: column; align-items: center; gap: 1.5rem; max-width: 460px; width: 90vw;">
          <img src="/musicsync-logo.png" alt="MusicSync" style="width: 100%; max-width: 460px; height: auto; object-fit: contain; mix-blend-mode: screen; border: none; outline: none; filter: drop-shadow(0 0 25px rgba(0,240,255,0.35));" />
          
          <div style="display: flex; align-items: center; gap: 10px; padding: 7px 18px; border-radius: 9999px; background: rgba(14, 16, 26, 0.9); border: 1px solid rgba(0, 240, 255, 0.35); box-shadow: 0 0 16px rgba(0, 240, 255, 0.2);">
            <div style="width: 12px; height: 12px; border: 2px solid rgba(0,240,255,0.2); border-top-color: #00f0ff; border-radius: 50%; animation: spin 1s linear infinite;"></div>
            <span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 700; color: #00f0ff; letter-spacing: 0.12em; text-transform: uppercase;">Initializing Mesh</span>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
