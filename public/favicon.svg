<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <defs>
    <linearGradient id="fav-grad" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
  </defs>

  {/* Squircle Chassis */}
  <rect x="2" y="2" width="44" height="44" rx="13" fill="#0c1017" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1.5" />

  {/* Left Acoustic Broadcast Wave */}
  <path
    d="M 9 17 C 6.5 21.2 6.5 26.8 9 31"
    stroke="url(#fav-grad)"
    stroke-width="2.75"
    stroke-linecap="round"
  />

  {/* Central Synchronized Waveform Bars */}
  <rect x="14" y="17" width="3" height="14" rx="1.5" fill="url(#fav-grad)" />
  <rect x="20" y="11" width="3" height="26" rx="1.5" fill="url(#fav-grad)" />
  <rect x="26" y="11" width="3" height="26" rx="1.5" fill="url(#fav-grad)" />
  <rect x="32" y="17" width="3" height="14" rx="1.5" fill="url(#fav-grad)" />

  {/* Right Acoustic Broadcast Wave */}
  <path
    d="M 39 17 C 41.5 21.2 41.5 26.8 39 31"
    stroke="url(#fav-grad)"
    stroke-width="2.75"
    stroke-linecap="round"
  />
</svg>
