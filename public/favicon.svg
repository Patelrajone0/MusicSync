<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="rim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="50%" stop-color="#9d4edd" />
      <stop offset="100%" stop-color="#ff007f" />
    </linearGradient>
    <radialGradient id="cone" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e0b36" />
      <stop offset="50%" stop-color="#0e0e18" />
      <stop offset="85%" stop-color="#06060a" />
      <stop offset="100%" stop-color="#141420" />
    </radialGradient>
    <linearGradient id="core" x1="35%" y1="35%" x2="65%" y2="65%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="30%" stop-color="#00f0ff" />
      <stop offset="70%" stop-color="#9d4edd" />
      <stop offset="100%" stop-color="#ff007f" />
    </linearGradient>
    <linearGradient id="wave" x1="10%" y1="10%" x2="90%" y2="90%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="50%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>
  </defs>

  <!-- Outer chassis squircle -->
  <rect x="4" y="4" width="92" height="92" rx="26" fill="#06060a" stroke="url(#rim)" stroke-width="5" />

  <!-- Acoustic cone cavity -->
  <circle cx="50" cy="50" r="41" fill="url(#cone)" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1.5" />

  <!-- Cardinal waveguide vent ports (12, 3, 6, 9) -->
  <path d="M 50 11 L 50 18 M 50 82 L 50 89 M 11 50 L 18 50 M 82 50 L 89 50" stroke="url(#rim)" stroke-width="4" stroke-linecap="round" />

  <!-- Outer concentric resonant shockwave ring (Ring 3) -->
  <circle cx="50" cy="50" r="34" stroke="url(#wave)" stroke-width="3" stroke-dasharray="8 4 16 4" fill="none" opacity="0.8" />

  <!-- Middle concentric resonant shockwave ring (Ring 2) -->
  <circle cx="50" cy="50" r="26" stroke="url(#rim)" stroke-width="3.5" stroke-dasharray="12 6" fill="none" opacity="0.9" />

  <!-- Inner acoustic surround roll (Ring 1) -->
  <circle cx="50" cy="50" r="18" stroke="url(#wave)" stroke-width="3.5" fill="none" />

  <!-- Transducer dust-cap dome -->
  <circle cx="50" cy="50" r="11" fill="url(#core)" />

  <!-- Center phase core -->
  <circle cx="50" cy="50" r="4.5" fill="#ffffff" />
  <polygon points="50,43.5 53,50 50,56.5 47,50" fill="#00f0ff" opacity="0.95" />
</svg>
